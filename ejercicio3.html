<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de productos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="card card--wide">
        <header class="page-header">
            <p class="eyebrow">Ejercicio 03</p>
            <h1>Inventario de productos</h1>
            <p class="intro">Registra productos y consulta el valor de tu inventario.</p>
        </header>

        <form id="formulario" class="form-panel">
            <label for="producto">Nombre del producto</label>
            <input type="text" id="producto" placeholder="Ej. Cuaderno" required>

            <label for="precio">Precio unitario</label>
            <input type="number" id="precio" min="0" step="any" placeholder="0.00" required>

            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad" min="1" step="1" placeholder="1" required>

            <button type="submit" id="btnAgregar">Agregar producto</button>
        </form>

        <section class="content-section">
            <h2>Productos registrados</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio unitario</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                    
                        </tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
        </section>

        <section class="summary-panel">
            <h2>Resultados</h2>
            <p id="total"></p>
            <p id="productoMayor"></p>
        </section>

        <a class="back-link" href="index.html">← Volver a los ejercicios</a>
    </main>

    <script src="js/ejercicio3.js"></script>
</body>
</html>
